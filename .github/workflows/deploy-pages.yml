name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'unit - 2 Project - 1/unit-2-pro-1/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'unit - 2 Project - 1/unit-2-pro-1/package-lock.json'

      - name: Install dependencies
        working-directory: 'unit - 2 Project - 1/unit-2-pro-1'
        run: npm ci

      - name: Build site
        working-directory: 'unit - 2 Project - 1/unit-2-pro-1'
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'unit - 2 Project - 1/unit-2-pro-1/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4