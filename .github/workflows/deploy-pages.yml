name: Deploy Web Interface Projects

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build all project apps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Web Interface Projects</title>
              <style>
                body { font-family: Arial, sans-serif; margin: 40px; background: #111827; color: #f9fafb; }
                .container { max-width: 900px; margin: 0 auto; }
                .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
                a { display: block; padding: 18px 20px; background: #1f2937; border: 1px solid #374151; border-radius: 12px; color: #fff; text-decoration: none; font-weight: 600; }
                a:hover { background: #374151; }
              </style>
            </head>
            <body>
              <div class="container">
                <h1>Web Interface Projects</h1>
                <div class="grid">
                  <a href="./unit-2-project-1/">Unit 2 Project 1</a>
                  <a href="./unit-2-project-2/">Unit 2 Project 2</a>
                  <a href="./unit-3-project-2/">Unit 3 Project 2</a>
                  <a href="./unit-3-project-1/">Unit 3 Project 1</a>
                  <a href="./unit-4-project-1/">Unit 4 Project 1</a>
                </div>
              </div>
            </body>
          </html>
          EOF

          build_project() {
            local project_path="$1"
            local out_dir="$2"
            echo "Building $project_path"
            cd "$GITHUB_WORKSPACE/$project_path"
            npm ci
            npm run build
            rm -rf "$GITHUB_WORKSPACE/site/$out_dir"
            cp -R dist "$GITHUB_WORKSPACE/site/$out_dir"
          }

          build_project "unit - 2 Project - 1/unit-2-pro-1" "unit-2-project-1"
          build_project "unit - 2 project - 2/unit-2-pro-2" "unit-2-project-2"
          build_project "unit - 3 project - 2/unit-3-pro-2" "unit-3-project-2"
          build_project "unit - 3 project -1/unit-3-pro-1" "unit-3-project-1"
          build_project "unit - 4 project - 1/unit-4-pro-1" "unit-4-project-1"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4